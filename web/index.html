<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Eventflow — Premium Event Management</title>
    <meta name="description" content="The premium platform to create, manage, and attend extraordinary events." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      window.addEventListener('error', function(e) {
        console.error('Global captured error:', e.error || e.message);
        var el = document.getElementById('root');
        if (el && !el.children.length) {
          el.innerHTML = '<div style="background:#0b0f19;color:#f87171;min-height:100vh;padding:40px;font-family:sans-serif;">' +
            '<h2 style="color:#ef4444">Application Startup Error</h2>' +
            '<p style="color:#94a3b8">Error: ' + (e.message || 'Script error') + '</p>' +
            '<pre style="background:#18181b;padding:16px;border-radius:8px;color:#fca5a5;overflow:auto">' + (e.error ? e.error.stack : '') + '</pre>' +
            '<button onclick="localStorage.clear();location.reload();" style="margin-top:16px;padding:10px 18px;background:#2563eb;color:#fff;border:none;border-radius:6px;cursor:pointer;font-weight:bold;">Clear Data & Reset to Login</button>' +
            '</div>';
        }
      });
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
