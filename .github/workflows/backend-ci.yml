name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore backend/EventManagement.sln

      - name: Build
        run: dotnet build backend/EventManagement.sln --no-restore --configuration Release

      # EventManagement.Api.Tests uses an EF Core InMemory database (see
      # CustomWebApplicationFactory.cs) so these run without a live Postgres
      # instance or any secrets — safe to run on every push/PR.
      - name: Test
        run: dotnet test backend/EventManagement.sln --no-build --configuration Release --logger "trx;LogFileName=test-results.trx"

      - name: Publish test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: backend/**/TestResults/**/*.trx
