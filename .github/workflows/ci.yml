name: Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    name: Build Backend (.NET 8)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
        
    - name: Restore dependencies
      run: dotnet restore
      working-directory: ./backend/EventManagement.Api
      
    - name: Build
      run: dotnet build --no-restore
      working-directory: ./backend/EventManagement.Api

  frontend:
    name: Build Frontend (React / Vite)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: './web/package-lock.json'
        
    - name: Install dependencies
      run: npm install
      working-directory: ./web
      
    - name: Build React App
      run: npm run build
      working-directory: ./web

  mobile:
    name: Check Mobile (Flutter)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
    - uses: actions/checkout@v4

    - name: Check mobile directory
      id: check_mobile
      run: |
        if [ -d "./mobile/eventflow-mobile---full/eventflow_mobile" ]; then
          echo "exists=true" >> $GITHUB_OUTPUT
        else
          echo "exists=false" >> $GITHUB_OUTPUT
        fi
    
    - name: Setup Flutter
      if: steps.check_mobile.outputs.exists == 'true'
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        cache: true
        
    - name: Install dependencies
      if: steps.check_mobile.outputs.exists == 'true'
      run: flutter pub get
      working-directory: ./mobile/eventflow-mobile---full/eventflow_mobile
      
    - name: Analyze project
      if: steps.check_mobile.outputs.exists == 'true'
      run: flutter analyze || true
      working-directory: ./mobile/eventflow-mobile---full/eventflow_mobile
