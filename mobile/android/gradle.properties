android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Kotlin's incremental compiler computes relative paths between the pub-cache
# (mobile_scanner's sources, on C:) and this project (on D:) and crashes with
# "this and base files have different roots" when they're on different Windows
# drive letters. Disabling incremental compilation avoids that path computation.
kotlin.incremental=false
