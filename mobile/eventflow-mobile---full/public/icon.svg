<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bg)" />
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4" />
  
  <!-- Ticket / Admission Pass Emblem -->
  <g transform="translate(106, 126)">
    <rect x="0" y="0" width="300" height="190" rx="36" fill="url(#accent)" filter="drop-shadow(0 20px 30px rgba(59,130,246,0.35))" />
    
    <!-- Notch Left & Right -->
    <circle cx="0" cy="95" r="24" fill="#0b0f19" />
    <circle cx="300" cy="95" r="24" fill="#0b0f19" />
    
    <!-- Perforated Line -->
    <line x1="85" y1="20" x2="85" y2="170" stroke="#ffffff" stroke-width="3" stroke-dasharray="8 8" opacity="0.4" />
    
    <!-- QR / Ticket Symbol Left -->
    <rect x="24" y="45" width="40" height="40" rx="8" fill="#ffffff" opacity="0.9" />
    <rect x="32" y="53" width="24" height="24" rx="4" fill="#1e1b4b" />
    <rect x="40" y="61" width="8" height="8" rx="2" fill="#ffffff" />
    <circle cx="44" cy="125" r="8" fill="#ffffff" opacity="0.7" />
    
    <!-- Ticket Text & Sparkle Right -->
    <text x="110" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="28" fill="#ffffff" letter-spacing="1">EVENTFLOW</text>
    <text x="110" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="16" fill="#93c5fd">VIP PASS · GATE ACCESS</text>
    <text x="110" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="14" fill="#e2e8f0" opacity="0.8">★ SRI LANKA SUMMIT</text>
  </g>
  
  <!-- Modern Android / Mobile Beacon Dots -->
  <circle cx="256" cy="380" r="8" fill="#60a5fa" />
  <circle cx="286" cy="380" r="4" fill="#818cf8" opacity="0.7" />
  <circle cx="226" cy="380" r="4" fill="#818cf8" opacity="0.7" />
</svg>
